name: Build and publish Next.js yolk

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/docker-publish.yml
  pull_request:
    branches: [main]
  # Weekly rebuild to pick up Node.js and Debian security updates.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: node${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # One image tag per entry: ghcr.io/<owner>/<repo>:node<version>
        # Remove the versions you do not want to offer in the egg.
        node: ["24", "25", "26"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # QEMU lets the amd64 runner also build the arm64 variant.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests only build; they never log in or push.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the image name (GHCR rejects upper case) and adds labels.
      - name: Compute image tag and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=raw,value=node${{ matrix.node }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ matrix.node }}
          cache-from: type=gha,scope=node${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=node${{ matrix.node }}